name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: |
          MODDIR=.
          [ -f package.json ] || MODDIR=mystix
          cd "$MODDIR"
          npm test

      - name: Syntax-check scripts and validate JSON
        run: |
          MODDIR=.
          [ -f package.json ] || MODDIR=mystix
          cd "$MODDIR"
          npm run check
